---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuworkloads.scheduling.gpu-platform.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: scheduling.gpu-platform.io
  names:
    kind: GPUWorkload
    listKind: GPUWorkloadList
    plural: gpuworkloads
    singular: gpuworkload
    shortNames: [gpuw]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: GPU
          type: string
          jsonPath: .spec.gpuRequirement
        - name: Priority
          type: integer
          jsonPath: .spec.priority
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Worker
          type: string
          jsonPath: .status.assignedWorker
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [workload, gpuRequirement, priority]
              properties:
                workload:
                  type: string
                  description: Workload type (e.g. llm_inference, gpu_benchmark).
                gpuRequirement:
                  type: string
                  enum: [T4, V100, A100, H100]
                  description: Required GPU model.
                priority:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Scheduling priority (1=lowest, 10=highest).
                maxRetries:
                  type: integer
                  minimum: 0
                  default: 3
                  description: Maximum retry attempts on failure.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Queued, Assigned, Running, Completed, Failed]
                message:
                  type: string
                assignedWorker:
                  type: string
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
