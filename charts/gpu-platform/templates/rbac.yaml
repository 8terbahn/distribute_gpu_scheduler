---
{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-platform.fullname" . }}-operator
  labels:
    {{- include "gpu-platform.labels" . | nindent 4 }}
rules:
  # GPU Platform CRDs
  - apiGroups: ["scheduling.gpu-platform.io", "platform.gpu-platform.io"]
    resources: ["gpuworkloads", "gpupools", "gpuenvironments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["scheduling.gpu-platform.io", "platform.gpu-platform.io"]
    resources: ["gpuworkloads/status", "gpupools/status", "gpuenvironments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["scheduling.gpu-platform.io", "platform.gpu-platform.io"]
    resources: ["gpuworkloads/finalizers", "gpupools/finalizers"]
    verbs: ["update"]
  # Core resources
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Crossplane introspection (read-only)
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["compositeresourcedefinitions", "compositions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpu-platform.fullname" . }}-operator
  labels:
    {{- include "gpu-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-platform.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
