---
# Operator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-platform.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: operator
    {{- include "gpu-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
      {{- include "gpu-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        {{- include "gpu-platform.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.operator.metrics.port }}"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - "--metrics-bind-address=:{{ .Values.operator.metrics.port }}"
            - "--health-probe-bind-address=:{{ .Values.operator.probes.port }}"
            {{- if .Values.operator.leaderElection }}
            - "--leader-elect=true"
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.operator.metrics.port }}
            - name: healthz
              containerPort: {{ .Values.operator.probes.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
---
{{- if .Values.workflowEngine.enabled }}
# Workflow Engine Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-platform.fullname" . }}-workflow-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: workflow-engine
    {{- include "gpu-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workflowEngine.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: workflow-engine
      {{- include "gpu-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: workflow-engine
        {{- include "gpu-platform.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workflow-engine
          image: "{{ .Values.workflowEngine.image.repository }}:{{ .Values.workflowEngine.image.tag }}"
          imagePullPolicy: {{ .Values.workflowEngine.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.workflowEngine.port }}
          env:
            - name: FINOPS_API_URL
              value: {{ .Values.workflowEngine.env.FINOPS_API_URL | quote }}
            - name: NOTIFY_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: {{ include "gpu-platform.fullname" . }}-secrets
                  key: notify-webhook
                  optional: true
            - name: K8S_API_URL
              value: {{ .Values.workflowEngine.env.K8S_API_URL | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.workflowEngine.resources | nindent 12 }}
{{- end }}
