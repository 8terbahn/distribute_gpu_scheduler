# Default values for the gpu-platform Helm chart.
# Override with: helm install ... -f my-values.yaml or --set key=value

# ── Operator ──────────────────────────────────────────────────────────────────
operator:
  image:
    repository: ghcr.io/8terbahn/distribute_gpu_scheduler/operator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  leaderElection: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  metrics:
    enabled: true
    port: 8081
  probes:
    port: 8082

# ── Workflow Engine ───────────────────────────────────────────────────────────
workflowEngine:
  enabled: true
  image:
    repository: ghcr.io/8terbahn/distribute_gpu_scheduler/workflow-engine
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8090
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    FINOPS_API_URL:  ""   # URL of your FinOps budget API
    NOTIFY_WEBHOOK:  ""   # Slack / Teams / generic webhook URL
    K8S_API_URL:     ""   # Defaults to in-cluster API server

# ── GPU Scheduler (legacy REST API, retained for backwards compatibility) ─────
scheduler:
  enabled: true
  image:
    repository: ghcr.io/8terbahn/distribute_gpu_scheduler/scheduler
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── GPU Workers ───────────────────────────────────────────────────────────────
worker:
  enabled: true
  image:
    repository: ghcr.io/8terbahn/distribute_gpu_scheduler/worker
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 3
  gpuType: A100
  gpuMemory: 80GB

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

# ── PostgreSQL ────────────────────────────────────────────────────────────────
postgres:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 8Gi

# ── Kyverno Policies ─────────────────────────────────────────────────────────
kyvernoPolicies:
  enabled: true

# ── Monitoring (requires kube-prometheus-stack) ───────────────────────────────
monitoring:
  prometheusRule:
    enabled: true
    namespace: monitoring
  grafanaDashboard:
    enabled: true

# ── CRDs ─────────────────────────────────────────────────────────────────────
# Set false if you manage CRDs externally (e.g. ArgoCD CRD sync policy).
installCRDs: true

# ── RBAC ─────────────────────────────────────────────────────────────────────
rbac:
  create: true

serviceAccount:
  create: true
  name: gpu-platform-operator
